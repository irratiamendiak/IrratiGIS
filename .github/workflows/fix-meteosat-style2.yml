name: Use neutral Meteosat WMS style
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Meteosat
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fire-popup.js')
          s=p.read_text()
          old='STYLES:variant.style??meteosatStyle??"default"'
          new='STYLES:variant.style??meteosatStyle??""'
          if old not in s: raise SystemExit('style expression not found')
          s=s.replace(old,new,1)
          old='const variants=[{version:"1.3.0",srs:"EPSG:4326"},{version:"1.1.1",srs:"EPSG:4326"},{version:"1.3.0",srs:"EPSG:4326",useTime:false}]'
          new='const variants=[{version:"1.1.1",srs:"EPSG:4326",useTime:false},{version:"1.3.0",srs:"EPSG:4326",useTime:false},{version:"1.1.1",srs:"EPSG:4326"},{version:"1.3.0",srs:"EPSG:4326"}]'
          if old not in s: raise SystemExit('variant list not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-meteosat-style2.yml
          git add fire-popup.js .github/workflows/fix-meteosat-style2.yml
          git commit -m 'Use neutral Meteosat WMS style'
          git push
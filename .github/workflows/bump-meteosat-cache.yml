name: Bump Meteosat cache
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('meteosat.js?v=20260907-04','meteosat.js?v=20260907-05')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Actualizar cachebuster Meteosat' || true
          git push
      - name: Remove helper
        run: |
          git rm .github/workflows/bump-meteosat-cache.yml || true
          git commit -m 'Eliminar helper temporal' || true
          git push || true

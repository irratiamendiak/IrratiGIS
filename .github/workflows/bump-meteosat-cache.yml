name: Bump Meteosat cache version

on:
  push:
    paths:
      - 'fire-popup.js'
      - 'auth.js'
      - 'index.html'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache versions
        shell: bash
        run: |
          sed -i 's/auth\.js?v=20260907-48/auth.js?v=20260907-49/g' index.html
          sed -i 's/fire-popup\.js?v=20260907-48/fire-popup.js?v=20260907-49/g' auth.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html auth.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bump Meteosat cache version'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/bump-meteosat-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary cache workflow'
          git push
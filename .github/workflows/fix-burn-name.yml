name: Corregir nombre de pestaña
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Corregir texto
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auth.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('baimendutAKO ERREKETAK','Baimendutako erreketak')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth.js
          git diff --cached --quiet || git commit -m 'Corregir nombre Baimendutako erreketak'
          git push
      - name: Eliminar workflow temporal
        if: always()
        run: |
          rm -f .github/workflows/fix-burn-name.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-burn-name.yml
          git diff --cached --quiet || git commit -m 'Eliminar workflow temporal'
          git push
name: One-off label fix

on:
  push:
    paths:
      - '.github/workflows/oneoff-label-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('auth.js')
          s = p.read_text()
          old = 'Erreketa baimenduak'
          new = 'Baimendutako erreketak'
          if old not in s:
              raise SystemExit('Label not found; refusing to change anything')
          p.write_text(s.replace(old, new))
          PY

      - name: Commit change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth.js
          git rm .github/workflows/oneoff-label-fix.yml
          git commit -m 'Replace fire section label'
          git push
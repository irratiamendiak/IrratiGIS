name: Patch Meteosat WMS
on:
  push:
    paths:
      - '.github/workflows/patch-meteosat-wms.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WMS request
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('meteosat.js')
          s=p.read_text(encoding='utf-8')
          old='''    dataset:DATASET,SERVICE:"WMS",VERSION:"1.1.1",REQUEST:"GetMap",\n    LAYERS:LAYER,STYLES:"",SRS:"EPSG:4326",BBOX:BBOX.join(","),\n    WIDTH:"1200",HEIGHT:"680",FORMAT:"image/png",TRANSPARENT:"TRUE",\n    TIME:iso(t),_irrati:Date.now().toString()+Math.random().toString(36).slice(2)'''
          new='''    dataset:DATASET,SERVICE:"WMS",VERSION:"1.3.0",REQUEST:"GetMap",\n    LAYERS:LAYER,STYLES:"auto/nearest",CRS:"EPSG:4326",\n    BBOX:`${BBOX[1]},${BBOX[0]},${BBOX[3]},${BBOX[2]}`,\n    WIDTH:"1200",HEIGHT:"680",FORMAT:"image/png",TRANSPARENT:"TRUE",\n    TIME:iso(t)'''
          if old not in s:
              raise SystemExit('No se encontró el bloque WMS esperado')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meteosat.js
          git commit -m 'Corregir peticiones WMS de Meteosat' || true
          git rm .github/workflows/patch-meteosat-wms.yml
          git commit -m 'Eliminar workflow temporal de Meteosat'
          git push
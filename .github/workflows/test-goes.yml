name: Test GOES-19 FDCF Malabrigo

on:
  push:
    paths:
      - '.github/workflows/test-goes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-goes:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xarray netCDF4 pyproj numpy

      - name: Locate GOES-19 FDCF files
        run: |
          set -euo pipefail
          YEAR=2026
          DOY=247
          HOUR=12
          PREFIX="ABI-L2-FDCF-M6"
          aws s3 ls "s3://noaa-goes19/${PREFIX}/${YEAR}/${DOY}/${HOUR}/" --no-sign-request > files.txt
          cat files.txt
          grep "${PREFIX}" files.txt | awk '{print $4}' > fdcf_files.txt
          test -s fdcf_files.txt

      - name: Download and inspect Malabrigo pixel
        run: |
          python - <<'PY'
          import os, subprocess
          import numpy as np
          import xarray as xr
          from pyproj import Transformer

          lat0, lon0 = 43.21, -3.18
          files = [x.strip() for x in open('fdcf_files.txt') if x.strip()]
          print('FILES:', len(files))
          for name in files:
              local = '/tmp/' + os.path.basename(name)
              subprocess.run(['aws','s3','cp',f's3://noaa-goes19/ABI-L2-FDCF-M6/2026/247/12/{name}',local,'--no-sign-request'],check=True)
              ds = xr.open_dataset(local)
              try:
                  proj = ds['goes_imager_projection']
                  lon_origin = float(proj.longitude_of_projection_origin)
                  h = float(proj.perspective_point_height)
                  a = float(proj.semi_major_axis)
                  b = float(proj.semi_minor_axis)
                  transformer = Transformer.from_crs('EPSG:4326', f'+proj=geos +h={h} +lon_0={lon_origin} +a={a} +b={b} +sweep=x', always_xy=True)
                  xx_m, yy_m = transformer.transform(lon0, lat0)
                  xx, yy = xx_m / h, yy_m / h
                  xi = int(np.abs(ds['x'].values - xx).argmin())
                  yi = int(np.abs(ds['y'].values - yy).argmin())
                  print('\nFILE', name)
                  print('nearest indexes:', yi, xi)
                  print('target fixed-grid x/y:', xx, yy)
                  print('pixel fixed-grid x/y:', float(ds['x'].values[xi]), float(ds['y'].values[yi]))
                  print('x/y distance:', float(abs(ds['x'].values[xi]-xx)), float(abs(ds['y'].values[yi]-yy)))
                  for var in ['Mask','Temp','Area','Power','DQF']:
                      if var in ds:
                          print(var, repr(ds[var].isel(y=yi,x=xi).values))
              finally:
                  ds.close()
          PY

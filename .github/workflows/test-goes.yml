name: Test GOES-19 FDCF Gordexola

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-goes:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xarray netCDF4 pyproj numpy

      - name: Discover GOES-19 FDCF product and files
        run: |
          set -euo pipefail
          YEAR=2026
          DOY=247
          HOUR=15
          echo '--- Product prefixes ---'
          aws s3api list-objects-v2 --bucket noaa-goes19 --prefix ABI-L2-FDC --delimiter / --no-sign-request --query 'CommonPrefixes[].Prefix' --output text | tr '\t' '\n' | tee prefixes.txt
          PREFIX=$(grep -E 'ABI-L2-FDCF(-M[0-9]+)?/$' prefixes.txt | head -n 1 || true)
          if [ -z "$PREFIX" ]; then
            PREFIX='ABI-L2-FDCF/'
          fi
          echo "Using product prefix: $PREFIX"
          KEY_PREFIX="${PREFIX}${YEAR}/${DOY}/${HOUR}/"
          echo "Listing: s3://noaa-goes19/${KEY_PREFIX}"
          aws s3 ls "s3://noaa-goes19/${KEY_PREFIX}" --no-sign-request | tee files.txt
          awk '{print $4}' files.txt | grep -E '^OR_ABI-L2-FDCF' > fdcf_files.txt
          test -s fdcf_files.txt
          printf 'PREFIX=%s\nKEY_PREFIX=%s\n' "$PREFIX" "$KEY_PREFIX" > goes.env

      - name: Download and inspect Gordexola pixel
        run: |
          set -euo pipefail
          source goes.env
          export KEY_PREFIX
          python - <<'PY'
          import os, subprocess
          import numpy as np
          import xarray as xr
          from pyproj import CRS, Transformer

          lat0, lon0 = 43.16, -3.13
          key_prefix = os.environ['KEY_PREFIX']
          files = [x.strip() for x in open('fdcf_files.txt') if x.strip()]
          print('TARGET:', lat0, lon0)
          print('EXPECTED FIREHUB TIME: 17:26 local = 15:26 UTC')
          print('FILES:', len(files))
          for name in files:
              local = '/tmp/' + os.path.basename(name)
              subprocess.run(['aws','s3','cp',f's3://noaa-goes19/{key_prefix}{name}',local,'--no-sign-request'],check=True)
              ds = xr.open_dataset(local)
              try:
                  proj = ds['goes_imager_projection']
                  lon_origin = float(proj.longitude_of_projection_origin)
                  h = float(proj.perspective_point_height)
                  a = float(proj.semi_major_axis)
                  b = float(proj.semi_minor_axis)
                  crs = CRS.from_proj4(f'+proj=geos +h={h} +lon_0={lon_origin} +a={a} +b={b} +sweep=x +units=m')
                  transformer = Transformer.from_crs('EPSG:4326', crs, always_xy=True)
                  xx_m, yy_m = transformer.transform(lon0, lat0)
                  xx, yy = xx_m / h, yy_m / h
                  xi = int(np.abs(ds['x'].values - xx).argmin())
                  yi = int(np.abs(ds['y'].values - yy).argmin())
                  print('\nFILE', name)
                  print('target fixed-grid x/y:', xx, yy)
                  print('pixel fixed-grid x/y:', float(ds['x'].values[xi]), float(ds['y'].values[yi]))
                  print('x/y distance:', float(abs(ds['x'].values[xi]-xx)), float(abs(ds['y'].values[yi]-yy)))
                  for var in ['Mask','Temp','Area','Power','DQF']:
                      if var in ds:
                          print(var, repr(ds[var].isel(y=yi,x=xi).values))
              finally:
                  ds.close()
          PY

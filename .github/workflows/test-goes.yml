name: Test GOES-19 FDCF Malabrigo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-goes:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xarray netCDF4 s3fs pyproj numpy

      - name: Locate GOES-19 FDCF files
        run: |
          set -euo pipefail
          YEAR=2026
          DOY=247
          HOUR=12
          aws s3 ls "s3://noaa-goes19/ABI-L2-FDCF/${YEAR}/${DOY}/${HOUR}/" --no-sign-request > files.txt
          cat files.txt
          grep 'ABI-L2-FDCF' files.txt | awk '{print $4}' > fdcf_files.txt
          test -s fdcf_files.txt

      - name: Download and inspect Malabrigo pixel
        run: |
          python - <<'PY'
          import os, subprocess, glob, json
          import numpy as np
          import xarray as xr
          from pyproj import Proj, Transformer

          lat0, lon0 = 43.21, -3.18
          files = [x.strip() for x in open('fdcf_files.txt') if x.strip()]
          print('FILES:', len(files))
          print('\n'.join(files))

          for name in files:
              local = '/tmp/' + os.path.basename(name)
              subprocess.run(['aws','s3','cp',f's3://noaa-goes19/ABI-L2-FDCF/2026/247/12/{name}',local,'--no-sign-request'],check=True)
              ds = xr.open_dataset(local)
              try:
                  x = float(ds['x'].values) if ds['x'].ndim == 0 else None
                  y = float(ds['y'].values) if ds['y'].ndim == 0 else None
                  proj = ds['goes_imager_projection']
                  lon_origin = float(proj.longitude_of_projection_origin)
                  h = float(proj.perspective_point_height)
                  a = float(proj.semi_major_axis)
                  b = float(proj.semi_minor_axis)
                  transformer = Transformer.from_crs('EPSG:4326', f'+proj=geos +h={h} +lon_0={lon_origin} +a={a} +b={b} +sweep=x', always_xy=True)
                  xx, yy = transformer.transform(lon0, lat0)
                  xi = int(np.abs(ds['x'].values - xx).argmin())
                  yi = int(np.abs(ds['y'].values - yy).argmin())
                  print('\nFILE', name)
                  print('nearest indexes', yi, xi, 'distance projection', float(abs(ds['x'].values[xi]-xx)), float(abs(ds['y'].values[yi]-yy)))
                  for var in ['Mask','Temp','Area','Power','Mask_DQF','Temp_DQF','Area_DQF','Power_DQF']:
                      if var in ds:
                          val = ds[var].isel(y=yi,x=xi).values
                          print(var, repr(val))
              finally:
                  ds.close()
          PY

name: Install Meteosat module
on:
  push:
    paths:
      - 'meteosat.js'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load Meteosat module in index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="meteosat.js?v=20260907-01" defer></script>'
          if tag not in s:
              needle='<script src="auth.js?v=20260904-36" defer></script>'
              if needle not in s:
                  raise SystemExit('No se encontró el script estable de auth.js; no se modifica index.html')
              s=s.replace(needle,needle+'\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Cargar módulo Meteosat FRP-PIXEL' || true
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/install-meteosat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github.actions[bot]@users.noreply.github.com'
          git commit -m 'Retirar instalador temporal de Meteosat'
          git push

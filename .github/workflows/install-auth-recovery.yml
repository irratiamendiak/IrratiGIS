name: Install auth recovery
on:
  push:
    paths:
      - 'auth-recovery.js'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore original index and install recovery
        shell: bash
        run: |
          set -e
          git checkout HEAD^ -- index.html
          sed -i 's#auth.js?v=20260907-[0-9]*#auth.js?v=20260907-51#' index.html
          sed -i 's#<script src="auth.js?v=20260907-51" defer></script>#<script src="auth.js?v=20260907-51" defer></script>\n<script src="auth-recovery.js?v=20260907-51" defer></script>#' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore index and load auth recovery'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/install-auth-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove auth recovery workflow'
          git push

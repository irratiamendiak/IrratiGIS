name: Ordenar pestaña de baimendutako erreketak
on:
  push:
    branches: [main]
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reordenar pestañas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('auth.js')
          s = p.read_text(encoding='utf-8')
          old = 'nav.innerHTML=`<button type="button" class="irrati-tab active" data-view="fires" aria-selected="true">🔥 Suteak</button><button type="button" class="irrati-tab" data-view="burns" aria-selected="false">🔥 Baimendutako erreketa</button><button type="button" class="irrati-tab" data-view="tracks" aria-selected="false">📐 Track-ak eta tresnak</button>`;'
          new = 'nav.innerHTML=`<button type="button" class="irrati-tab" data-view="fires" aria-selected="false">🔥 Suteak</button><button type="button" class="irrati-tab active" data-view="burns" aria-selected="true">🔥 baimendutAKO ERREKETAK</button><button type="button" class="irrati-tab" data-view="tracks" aria-selected="false">📐 Track-ak eta tresnak</button>`;'
          if old not in s:
              raise SystemExit('No se encontró el bloque de pestañas esperado')
          s = s.replace(old, new, 1)
          s = s.replace('h2>Baimendutako erreketa</h2>', 'h2>baimendutAKO ERREKETAK</h2>', 1)
          s = s.replace('subtitle.textContent="Suteak · Baimendutako erreketa · Track-ak · GIS tresnak";', 'subtitle.textContent="baimendutAKO ERREKETAK · Suteak · Track-ak · GIS tresnak";', 1)
          s = s.replace('setMapMode("fires");', 'setMapMode("burns");', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth.js
          git diff --cached --quiet || git commit -m "Poner baimendutako erreketak en primer lugar"
          git push
      - name: Eliminar workflow temporal
        if: always()
        run: |
          rm -f .github/workflows/one-shot-tabs-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-tabs-order.yml
          git diff --cached --quiet || git commit -m "Eliminar workflow temporal de pestañas"
          git push

name: Wildfire simulator core tests

on:
  push:
    branches:
      - "feature/wildfire-mdt-provider"
    paths:
      - "wildfire/simulator/**"
      - "wildfire/tests/**"
      - "index.html"
      - ".github/workflows/wildfire-simulator-tests.yml"
  pull_request:
    paths:
      - "wildfire/simulator/**"
      - "wildfire/tests/**"
      - "index.html"
      - ".github/workflows/wildfire-simulator-tests.yml"
  workflow_dispatch:

jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test wildfire simulator and terrain readers
        run: node --test wildfire/tests/*.test.mjs

name: Fix login redirect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auth.js'
      - '.github/workflows/fix-login-redirect.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker login redirect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old='const post=(payload,status=200)=>new Response(`<script>parent.postMessage(${JSON.stringify(payload)},${JSON.stringify(ALLOWED_ORIGIN)})</script>`,{status,headers:htmlHeaders});'
          new='const post=(payload,status=200)=>{const remember=payload.remember==="0"?"0":"1";const target=payload.token?`${ALLOWED_ORIGIN}/IrratiGIS/#irrati_token=${encodeURIComponent(payload.token)}&remember=${remember}`:`${ALLOWED_ORIGIN}/IrratiGIS/#irrati_login_error=${encodeURIComponent(payload.error||"Login failed")}`;return new Response(`<script>location.replace(${JSON.stringify(target)})</script>`,{status,headers:htmlHeaders})};'
          if old not in s:
              raise SystemExit('login-form post() not found')
          s=s.replace(old,new,1)
          s=s.replace('const form=await request.formData(),user=String(form.get("user")||"").trim(),password=String(form.get("password")||""),validUser=', 'const form=await request.formData(),user=String(form.get("user")||"").trim(),password=String(form.get("password")||""),remember=String(form.get("remember")||"1"),validUser=',1)
          s=s.replace('if(!valid)return post({type:"irratiGISLogin",error:"Unauthorized"},401);\n    return post({type:"irratiGISLogin",token:await createToken(user,validPassword)},200);', 'if(!valid)return post({type:"irratiGISLogin",error:"Unauthorized"},401);\n    return post({type:"irratiGISLogin",token:await createToken(user,validPassword),remember},200);',1)
          p.write_text(s)
          PY
      - name: Commit and push Worker fix
        run: |
          if git diff --quiet -- worker.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git commit -m 'Fix login redirect flow'
          git push
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --keep-vars

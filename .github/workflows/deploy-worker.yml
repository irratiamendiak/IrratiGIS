name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'auth.js'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch Worker auth compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("worker.js")
          s = p.read_text()
          old = 'async function authPayload(request,env){const auth=request.headers.get("Authorization")||"",token=auth.startsWith("Bearer ")?auth.slice(7).trim():"";return verifyToken(token,String(env.IRRATIGIS_LOGIN_PASSWORD||""))}'
          new = 'async function authPayload(request,env){const auth=request.headers.get("Authorization")||"",token=auth.startsWith("Bearer ")?auth.slice(7).trim():"";if(!token)return null;const primary=String(env.IRRATIGIS_LOGIN_PASSWORD||"");const legacy=String(env.GFA_PASSWORD||"");return await verifyToken(token,primary)||((legacy&&legacy!==primary)?await verifyToken(token,legacy):null)}'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Make FIRMS endpoint public
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("worker.js")
          s = p.read_text()
          old = 'if(url.pathname==="/api/firms"&&request.method==="GET"){const payload=await authPayload(request,env);if(!payload)return json({ok:false,error:"Unauthorized"},401,origin);try{'
          new = 'if(url.pathname==="/api/firms"&&request.method==="GET"){try{'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Harden login fallback and token signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("worker.js")
          s = p.read_text()
          old = 'if(!valid){const gfa=await fetch(`${GFA_BASE_URL}/login/es`,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({user,password})});valid=gfa.ok}'
          new = 'if(!valid&&user!==validUser){const gfa=await fetch(`${GFA_BASE_URL}/login/es`,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({user,password}),signal:AbortSignal.timeout(12000)});valid=gfa.ok}'
          if old in s:
              s = s.replace(old, new, 1)
          old2 = 'if(!valid){const gfa=await fetch(`${GFA_BASE_URL}/login/es`,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({user,password}),signal:AbortSignal.timeout(12000)});valid=gfa.ok}'
          new2 = 'if(!valid&&user!==validUser){const gfa=await fetch(`${GFA_BASE_URL}/login/es`,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({user,password}),signal:AbortSignal.timeout(12000)});valid=gfa.ok}'
          if old2 in s:
              s = s.replace(old2, new2, 1)
          s = s.replace('createToken(user,validPassword||password)', 'createToken(user,validPassword)', 1)
          p.write_text(s)
          PY

      - name: Harden browser login and cache bust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("auth.js")
          s = p.read_text()
          s = s.replace('return fetch(`${API}${path}`,options);', 'return fetch(`${API}${path}`,{...options,mode:"cors",credentials:"omit",cache:"no-store"});', 1)
          s = s.replace('fire-popup.js?v=20260902-32', 'fire-popup.js?v=20260904-33', 1)
          s = s.replace('🔥 Suteak eta Baimendutako erreketak', '🔥 Suteak eta baimendutako erreketak', 2)
          p.write_text(s)
          PY

      - name: Persist patched sources
        run: |
          if git diff --quiet -- worker.js auth.js; then
            echo "Sources already contain the login/FIRMS/cache fixes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add worker.js auth.js
            git commit -m "Harden login and cache bust auth"
            git push
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --keep-vars

      - name: Smoke test Worker CORS and login
        run: |
          set -e
          BASE="https://irratigis-erreketak.kulixka-mendiak.workers.dev"
          ORIGIN="https://irratiamendiak.github.io"
          echo "== health =="
          curl -fsS -D /tmp/health.headers -o /tmp/health.json -H "Origin: ${ORIGIN}" "${BASE}/api/health"
          grep -i '^access-control-allow-origin:' /tmp/health.headers
          cat /tmp/health.json
          echo
          echo "== login =="
          code=$(curl -sS -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}' -X POST -H "Origin: ${ORIGIN}" -H 'Content-Type: text/plain;charset=UTF-8' --data '{"user":"__smoke__","password":"__smoke__"}' "${BASE}/api/login")
          echo "HTTP ${code}"
          grep -i '^access-control-allow-origin:' /tmp/login.headers
          cat /tmp/login.json
          echo
          test "${code}" = "400" || test "${code}" = "401"

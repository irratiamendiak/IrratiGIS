name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bust browser cache for auth.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          s,n=re.subn(r'<script src="auth\.js(?:\?v=[^"]*)?" defer></script>', '<script src="auth.js?v=20260904-36" defer></script>', s, count=1)
          if n:
              p.write_text(s)
              print('auth.js cache-busting version set')
          else:
              raise SystemExit('auth.js script tag not found')
          PY
      - name: Persist cache-busting change
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust auth.js browser cache'
          git push
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --keep-vars
      - name: Smoke test Worker
        run: |
          set -e
          BASE="https://irratigis-erreketak.kulixka-mendiak.workers.dev"
          ORIGIN="https://irratiamendiak.github.io"
          curl -fsS -D /tmp/health.headers -o /tmp/health.json -H "Origin: ${ORIGIN}" "${BASE}/api/health"
          grep -i '^access-control-allow-origin:' /tmp/health.headers
          cat /tmp/health.json
          echo
          code=$(curl -sS -o /tmp/login-form.html -w '%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'user=__smoke__&password=__smoke__&remember=1' "${BASE}/api/login-form")
          echo "login-form HTTP ${code}"
          cat /tmp/login-form.html
          grep -q 'irratiGIS' /tmp/login-form.html
          test "${code}" = "400" || test "${code}" = "401"

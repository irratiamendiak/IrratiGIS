name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --keep-vars
      - name: Smoke test Worker
        run: |
          set -e
          BASE="https://irratigis-erreketak.kulixka-mendiak.workers.dev"
          ORIGIN="https://irratiamendiak.github.io"
          curl -fsS -D /tmp/health.headers -o /tmp/health.json -H "Origin: ${ORIGIN}" "${BASE}/api/health"
          grep -i '^access-control-allow-origin:' /tmp/health.headers
          cat /tmp/health.json
          echo
          code=$(curl -sS -o /tmp/login-form.html -w '%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'user=__smoke__&password=__smoke__&remember=1' "${BASE}/api/login-form")
          echo "login-form HTTP ${code}"
          grep -q 'irratiGIS' /tmp/login-form.html
          test "${code}" = "400" || test "${code}" = "401"

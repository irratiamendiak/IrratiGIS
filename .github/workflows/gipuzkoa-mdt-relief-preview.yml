name: Build Gipuzkoa MDT relief preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gipuzkoa-mdt-relief-preview.yml

permissions:
  contents: read

jobs:
  relief-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout processing scripts
        uses: actions/checkout@v4
        with:
          ref: feature/wildfire-intelligence-foundation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependencies
        run: pip install "numpy>=1.26,<3" "rasterio>=1.4,<2" "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "matplotlib>=3.8,<4"
      - name: Test terrain derivative calculations
        run: |
          pip install "pytest>=8,<9"
          python -m pytest -q wildfire/terrain/tests
      - name: Prepare pilot boundary
        run: |
          python wildfire/ingestion/prepare_gipuzkoa_boundary.py \
            --catalog wildfire/ingestion/sources.euskadi-gipuzkoa.json \
            --output data/processed/gipuzkoa
      - name: Fetch official 1:5,000 sheet index
        run: |
          python wildfire/ingestion/fetch_arcgis_sheet_index.py \
            --boundary data/processed/gipuzkoa/gipuzkoa_boundary.gpkg \
            --boundary-layer pilot_boundary \
            --output data/processed/gipuzkoa/mdt_5000_sheet_index.gpkg
      - name: Check selected MDT ZIP URLs
        run: |
          python wildfire/ingestion/check_mdt_zip_availability.py \
            --index data/processed/gipuzkoa/mdt_5000_sheet_index.json \
            --output-dir data/processed/gipuzkoa/mdt_zip_check
      - name: Create real shaded-relief preview from three tiles
        run: |
          python wildfire/ingestion/create_mdt_relief_preview.py \
            --availability data/processed/gipuzkoa/mdt_zip_check/mdt_2017_zip_availability.json \
            --boundary data/processed/gipuzkoa/gipuzkoa_boundary.gpkg \
            --boundary-layer pilot_boundary \
            --output-dir data/processed/gipuzkoa/mdt_relief_preview
      - name: Derive slope, aspect, hillshade and quality mask
        run: >-
          python wildfire/terrain/derive_terrain_variables.py
          --dem data/processed/gipuzkoa/mdt_relief_preview/gipuzkoa_mdt_relief_preview_3_tiles.tif
          --output-dir data/processed/gipuzkoa/terrain_derivatives
      - name: Audit unique-cell coverage and NoData in sampled DEM
        run: >-
          python wildfire/terrain/audit_dem_coverage_and_seams.py
          --mosaic data/processed/gipuzkoa/mdt_relief_preview/gipuzkoa_mdt_relief_preview_3_tiles.tif
          --boundary data/processed/gipuzkoa/gipuzkoa_boundary.gpkg
          --boundary-layer pilot_boundary
          --output data/processed/gipuzkoa/terrain_derivatives/coverage_audit.json
      - name: Audit source-tile seams in sampled area
        shell: bash
        run: |
          mapfile -t tiles < <(find data/processed/gipuzkoa/mdt_relief_preview/source_tiles -name '*.tif' -type f | sort)
          python wildfire/terrain/audit_dem_coverage_and_seams.py \
            --mosaic data/processed/gipuzkoa/mdt_relief_preview/gipuzkoa_mdt_relief_preview_3_tiles.tif \
            --boundary data/processed/gipuzkoa/gipuzkoa_boundary.gpkg \
            --boundary-layer pilot_boundary \
            --tiles "${tiles[@]}" \
            --output data/processed/gipuzkoa/terrain_derivatives/coverage_and_seams_audit.json
      - name: Upload relief preview and terrain derivatives
        uses: actions/upload-artifact@v4
        with:
          name: gipuzkoa-mdt-relief-preview
          path: |
            data/processed/gipuzkoa/mdt_relief_preview/gipuzkoa_mdt_relief_preview_3_tiles.png
            data/processed/gipuzkoa/mdt_relief_preview/gipuzkoa_mdt_relief_preview_3_tiles.tif
            data/processed/gipuzkoa/terrain_derivatives/*.tif
            data/processed/gipuzkoa/terrain_derivatives/terrain_derivatives_report.json
            data/processed/gipuzkoa/terrain_derivatives/coverage_audit.json
            data/processed/gipuzkoa/terrain_derivatives/coverage_and_seams_audit.json
          if-no-files-found: error
          retention-days: 14

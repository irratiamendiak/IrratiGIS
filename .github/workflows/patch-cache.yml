name: Patch Meteosat cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar versiones cacheadas
        run: |
          sed -i 's/auth\.js?v=20260907-[0-9]*/auth.js?v=20260907-46/' index.html
          sed -i 's/fire-popup\.js?v=20260907-[0-9]*/fire-popup.js?v=20260907-46/' auth.js
          rm -f .github/workflows/patch-cache.yml .github/workflows/trigger-cache.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html auth.js .github/workflows/patch-cache.yml .github/workflows/trigger-cache.txt
          git diff --cached --quiet || git commit -m 'Bump Meteosat cache versions'
          git push

name: Fix Meteosat WMS time
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WMS time and CRS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('meteosat.js')
          s=p.read_text()
          old='directWms=L.tileLayer.wms("https://adaguc.lsasvcs.ipma.pt//adagucserver?dataset=MSG-FRP&",{layers:"MSG:FRP-PIXEL",styles:"",format:"image/png",transparent:true,version:"1.1.1",time:slot(d),opacity:.95,zIndex:650})'
          new='directWms=L.tileLayer.wms("https://adaguc.lsasvcs.ipma.pt//adagucserver?dataset=MSG-FRP&",{layers:"MSG:FRP-PIXEL",styles:"",format:"image/png",transparent:true,version:"1.3.0",crs:L.CRS.EPSG4326,time:d.toISOString(),opacity:.95,zIndex:650})'
          if old not in s: raise SystemExit('WMS pattern not found')
          p.write_text(s.replace(old,new))
          idx=Path('index.html'); t=idx.read_text(); import re
          idx.write_text(re.sub(r'meteosat\\.js\\?v=[0-9-]+','meteosat.js?v=20260907-10',t))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meteosat.js index.html
          git commit -m 'Fix Meteosat WMS time format'
          git push
      - name: Remove helper
        run: |
          git rm .github/workflows/fix-meteosat-wms-time.yml
          git commit -m 'Remove Meteosat WMS time helper'
          git push

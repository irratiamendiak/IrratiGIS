name: Fix FIRMS map bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch map bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'const map=L.map("map",{center:[43.05,-2.2],zoom:9});'
          new = old + '\nwindow.IrratiGISMap=map;'
          if 'window.IrratiGISMap=map;' not in s:
              if old not in s:
                  raise SystemExit('Map initialization string not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Fix FIRMS map bridge'
            git push
          fi

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/fix-firms-map.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/fix-firms-map.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove temporary FIRMS fix workflow'
          git push

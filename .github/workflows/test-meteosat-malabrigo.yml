name: Test Meteosat Malabrigo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-meteosat-malabrigo.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: Query Meteosat fire layer at Malabrigo
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, urllib.parse, urllib.request
          from PIL import Image
          import numpy as np

          lat, lon = 43.21723, -3.17626
          times = [
              '2026-09-04T15:10:00.000Z',
              '2026-09-04T15:20:00.000Z',
              '2026-09-04T15:30:00.000Z',
              '2026-09-04T15:40:00.000Z',
              '2026-09-04T15:50:00.000Z',
              '2026-09-04T16:00:00.000Z',
          ]
          dlat = dlon = 0.005
          bbox = f'{lat-dlat},{lon-dlon},{lat+dlat},{lon+dlon}'
          print(f'Malabrigo (Sopuerta): {lat},{lon}')
          print('Times UTC; local time is UTC+2')
          for t in times:
              params = {
                  'service':'WMS','request':'GetMap','version':'1.3.0',
                  'layers':'msg_fes:fire','styles':'','format':'image/png',
                  'transparent':'true','crs':'EPSG:4326','bbox':bbox,
                  'width':'101','height':'101','time':t,
              }
              url = 'https://view.eumetsat.int/geoserver/wms?' + urllib.parse.urlencode(params)
              try:
                  data = urllib.request.urlopen(url, timeout=30).read()
                  arr = np.array(Image.open(io.BytesIO(data)).convert('RGBA'))
                  center = arr[50,50].tolist()
                  patch = arr[47:54,47:54]
                  vals, counts = np.unique(patch.reshape(-1,4), axis=0, return_counts=True)
                  order = np.argsort(counts)[::-1][:10]
                  top = [(vals[i].tolist(), int(counts[i])) for i in order]
                  print(t, 'CENTER_RGBA=', center, 'TOP_PATCH=', top)
              except Exception as e:
                  print(t, 'ERROR', repr(e))
          PY

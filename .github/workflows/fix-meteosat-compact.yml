name: Ajustar Meteosat compacto
on:
  push:
    paths:
      - '.github/workflows/fix-meteosat-compact.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar Meteosat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('meteosat.js')
          s=p.read_text()
          s=s.replace('STYLES:"auto/nearest"','STYLES:""')
          s=s.replace('width:min(320px,calc(100vw - 20px))','width:min(270px,calc(100vw - 20px))')
          s=s.replace('padding:8px;font:12px','padding:7px;font:11px')
          s=s.replace('.irrati-meteosat-head strong{font-size:13px}', '.irrati-meteosat-head strong{font-size:12px}')
          s=s.replace('.irrati-meteosat-ranges{display:flex;gap:6px;margin-top:9px}', '.irrati-meteosat-ranges{display:flex;gap:4px;margin-top:7px}')
          s=s.replace('padding:6px 7px;font-weight:800', 'padding:5px 6px;font-weight:800')
          s=s.replace('.irrati-meteosat-time{text-align:center;font-weight:800;margin:9px 0 4px}', '.irrati-meteosat-time{text-align:center;font-weight:800;margin:7px 0 3px}')
          s=s.replace('.irrati-meteosat-status{margin-top:7px;padding:7px 8px', '.irrati-meteosat-status{margin-top:5px;padding:5px 6px')
          s=s.replace('.irrati-meteosat-note{font-size:9px;margin-top:7px}', '.irrati-meteosat-note{font-size:8px;margin-top:5px}')
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('meteosat.js?v=20260907-1','meteosat.js?v=20260907-3')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meteosat.js index.html
          git commit -m 'Corregir estilo WMS y compactar Meteosat'
          git push
          rm .github/workflows/fix-meteosat-compact.yml
          git add .github/workflows/fix-meteosat-compact.yml
          git commit -m 'Limpiar workflow temporal de Meteosat'
          git push

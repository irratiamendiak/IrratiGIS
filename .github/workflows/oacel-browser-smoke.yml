name: OACEL browser smoke tests
# Browser-level startup and panel regression checks for the OACEL interface.

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/oacel-export-anchors]

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run OACEL browser smoke tests
        run: node tests/oacel-browser-smoke.mjs

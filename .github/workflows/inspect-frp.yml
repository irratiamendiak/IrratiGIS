name: Inspect LSA SAF FRP
on:
  push:
    paths: ['.github/workflows/inspect-frp.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect HDF5
        run: |
          python -m pip install h5py -q
          python - <<'PY'
          import urllib.request, h5py, tempfile, os
          url='https://datalsasaf.lsasvcs.ipma.pt/PRODUCTS/MSG/FRP-PIXEL/HDF5/2026/07/28/HDF5_LSASAF_MSG_FRP-PIXEL-ListProduct_MSG-Disk_202607281500'
          fn='/tmp/frp.h5'
          urllib.request.urlretrieve(url, fn)
          print('SIZE', os.path.getsize(fn))
          with h5py.File(fn,'r') as f:
              def walk(name,obj):
                  if isinstance(obj,h5py.Dataset):
                      print('DATASET',name,'shape=',obj.shape,'dtype=',obj.dtype)
                      for k,v in obj.attrs.items():
                          print(' ATTR',k,repr(v))
                  else:
                      print('GROUP',name)
                      for k,v in obj.attrs.items():
                          print(' GATTR',k,repr(v))
              f.visititems(walk)
          PY

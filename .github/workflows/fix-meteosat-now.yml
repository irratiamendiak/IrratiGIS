name: Meteosat visibility fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          sed -i 's/bottom:42px;/bottom:78px;/' meteosat.js
          sed -i 's/zIndex:620/zIndex:700/' meteosat.js
          sed -i 's/zIndexOffset:1500/zIndexOffset:5000/' meteosat.js
          sed -i 's/width:22px;height:22px;font-size:21px/width:30px;height:30px;font-size:30px/' meteosat.js
          sed -i 's/meteosat.js?v=20260907-06/meteosat.js?v=20260907-07/' index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meteosat.js index.html
          git commit -m 'Fix Meteosat panel and marker visibility'
          git push

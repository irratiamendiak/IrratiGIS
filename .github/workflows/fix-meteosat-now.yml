name: Meteosat visibility fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meteosat.js index.html
          git commit -m 'Fix Meteosat marker visibility and panel position'
          git push

name: Check public terrain asset access

on:
  pull_request:
    paths:
      - ".github/workflows/check-public-terrain-assets.yml"
      - "wildfire/terrain-config.js"
      - "index.html"
      - "docs/WILDFIRE-PREVIEW.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  range-and-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check COG and forest PMTiles byte-range access
        shell: bash
        run: |
          set -euo pipefail
          check_asset "Gipuzkoa MDT COG (production)" \
            "https://pub-997427d08539450780c6722ce7d23750.r2.dev/terrain/gipuzkoa/mdt-lidar-2017-1m.cog.tif" \
            "https://irratiamendiak.github.io"
          check_asset "Gipuzkoa MDT COG (preview)" \
            "https://pub-997427d08539450780c6722ce7d23750.r2.dev/terrain/gipuzkoa/mdt-lidar-2017-1m.cog.tif" \
            "https://feature-wildfire-mdt-provide.irratigis-wildfire-preview.pages.dev"
          check_asset "Gipuzkoa forest PMTiles (production)" \
            "https://pub-997427d08539450780c6722ce7d23750.r2.dev/neatogeo_forestal_gipuzkoa%281%29.pmtiles" \
            "https://irratiamendiak.github.io"
          check_asset "Gipuzkoa forest PMTiles (preview)" \
            "https://pub-997427d08539450780c6722ce7d23750.r2.dev/neatogeo_forestal_gipuzkoa%281%29.pmtiles" \
            "https://feature-wildfire-mdt-provide.irratigis-wildfire-preview.pages.dev"

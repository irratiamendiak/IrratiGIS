name: Optimize FIRMS source query
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize FIRMS origin request
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old='const d=Math.min(7,Math.max(1,Number(days)||1)),url=`${FIRMS_BASE_URL}/api/area/csv/${encodeURIComponent(key)}/VIIRS_SNPP_NRT/-4,41.9,-1,44.2/${d}`,r=await fetch(url,{headers:{Accept:"text/csv"}}),text=await r.text();'
          new='const d=Math.min(5,Math.max(1,Number(days)||1)),url=`${FIRMS_BASE_URL}/api/area/csv/${encodeURIComponent(key)}/VIIRS_SNPP_NRT/-4,41.9,-1,44.2/${d}`,r=await fetch(url,{headers:{Accept:"text/csv"},cf:{cacheTtl:60,cacheEverything:true}}),text=await r.text();'
          if old not in s:
            raise SystemExit('FIRMS fetch anchor not found')
          if 'cf:{cacheTtl:60,cacheEverything:true}' not in s:
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit optimization and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/optimize-firms-phase3.yml
          git add worker.js .github/workflows/optimize-firms-phase3.yml
          git commit -m 'Speed up FIRMS source requests'
          git push

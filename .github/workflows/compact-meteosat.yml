name: Compactar panel Meteosat
on:
  push:
    paths:
      - '.github/workflows/compact-meteosat.yml'

jobs:
  compact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compactar panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('meteosat.js')
          s=p.read_text()
          reps={
            'width:min(430px,calc(100vw - 28px))':'width:min(320px,calc(100vw - 20px))',
            'border-radius:12px;box-shadow:0 3px 18px rgba(0,0,0,.25);padding:11px':'border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.22);padding:8px',
            '.irrati-meteosat-head strong{font-size:14px}':'.irrati-meteosat-head strong{font-size:13px}',
            'margin-top:4px}.irrati-meteosat-ranges':'margin-top:3px}.irrati-meteosat-ranges',
            'margin-top:9px}.irrati-meteosat-legend':'margin-top:6px}.irrati-meteosat-legend',
            'grid-template-columns:repeat(4,1fr)':'grid-template-columns:repeat(2,1fr)',
            'font-size:10px':'font-size:9px',
            'width:11px;height:11px':'width:10px;height:10px',
            'padding:8px 9px':'padding:6px 7px',
            '.irrati-meteosat-note{color:#65736b;margin-top:4px}':'.irrati-meteosat-note{display:none}',
            'bottom:42px':'bottom:34px'
          }
          for a,b in reps.items():
              s=s.replace(a,b)
          s=s.replace('🛰️ Meteosat · FRP-PIXEL','🛰️ Meteosat · FRP')
          p.write_text(s)

          q=Path('index.html')
          t=q.read_text()
          t=t.replace('meteosat.js?v=20260907-1','meteosat.js?v=20260907-3')
          q.write_text(t)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meteosat.js index.html .github/workflows/compact-meteosat.yml
          git commit -m 'Compactar panel Meteosat y renovar cache' || exit 0
          git rm .github/workflows/compact-meteosat.yml
          git commit -m 'Eliminar workflow temporal de Meteosat'
          git push

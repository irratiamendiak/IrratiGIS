name: Allow isolated wildfire preview to read the public MDT COG

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/allow-wildfire-preview-cog-cors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-preview-origin:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/wildfire-mdt-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: irrati-inventario
      PREVIEW_ORIGIN: https://feature-wildfire-mdt-provide.irratigis-wildfire-preview.pages.dev
    steps:
      - name: Validate R2 credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          echo "Credentials are present; secret values are never printed."

      - name: Read and extend bucket CORS without removing existing rules
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_ENDPOINT_URL=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
          if aws s3api get-bucket-cors --bucket "$R2_BUCKET" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" > /tmp/cors-before.json 2>/tmp/cors-get.err; then
            :
          elif grep -q 'NoSuchCORSConfiguration' /tmp/cors-get.err; then
            printf '{"CORSRules":[]}' > /tmp/cors-before.json
          else
            cat /tmp/cors-get.err
            exit 1
          fi
          python - <<'PY'
          import json
          p="/tmp/cors-before.json"
          config=json.load(open(p))
          rules=config.get("CORSRules", [])
          origin="https://feature-wildfire-mdt-provide.irratigis-wildfire-preview.pages.dev"
          existing=next((r for r in rules if origin in r.get("AllowedOrigins", [])), None)
          if existing:
              methods=set(existing.get("AllowedMethods", []))
              if not {"GET","HEAD"}.issubset(methods):
                  raise SystemExit("Existing preview-origin rule does not allow both GET and HEAD; refusing to broaden or overwrite it.")
              print("Preview origin already has GET/HEAD CORS access; no duplicate rule needed.")
          else:
              rules.append({
                  "AllowedOrigins":[origin],
                  "AllowedMethods":["GET","HEAD"],
                  "AllowedHeaders":["range","if-range"],
                  "ExposeHeaders":["Accept-Ranges","Content-Range","Content-Length","ETag"],
                  "MaxAgeSeconds":3600
              })
              print("Added one exact-origin rule limited to GET/HEAD and byte-range headers.")
          json.dump({"CORSRules":rules},open("/tmp/cors-after.json","w"),indent=2)
          PY
          aws s3api put-bucket-cors --bucket "$R2_BUCKET" --cors-configuration file:///tmp/cors-after.json --endpoint-url "$AWS_ENDPOINT_URL"
          aws s3api get-bucket-cors --bucket "$R2_BUCKET" --endpoint-url "$AWS_ENDPOINT_URL" > /tmp/cors-verified.json
          python - <<'PY'
          import json
          rules=json.load(open("/tmp/cors-verified.json"))["CORSRules"]
          origin="https://feature-wildfire-mdt-provide.irratigis-wildfire-preview.pages.dev"
          matches=[r for r in rules if origin in r.get("AllowedOrigins",[])]
          assert matches, "Preview origin rule was not persisted"
          r=matches[0]
          assert set(r.get("AllowedMethods",[])) >= {"GET","HEAD"}
          assert set(r.get("AllowedHeaders",[])) >= {"range","if-range"}
          print("Verified exact preview origin: GET/HEAD only; range headers; no credentials.")
          PY

name: Test Meteosat Active Fire

on:
  push:
    paths:
      - '.github/workflows/test-meteosat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-meteosat:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: Query EUMETView MSG fire layer
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import urllib.parse
          import urllib.request
          from PIL import Image
          import numpy as np

          points = {
              'Gordexola': (43.1600, -3.1300),
              'Zalla_Angostura': (43.1879, -3.154360),
          }
          times = [
              '2026-09-04T15:10:00.000Z',
              '2026-09-04T15:20:00.000Z',
              '2026-09-04T15:30:00.000Z',
              '2026-09-04T15:40:00.000Z',
              '2026-09-04T15:50:00.000Z',
          ]

          # Small WGS84 boxes around each reported location. WMS 1.3.0 + EPSG:4326
          # requires bbox order lat,lon.
          for place, (lat, lon) in points.items():
              dlat, dlon = 0.06, 0.06
              bbox = f'{lat-dlat},{lon-dlon},{lat+dlat},{lon+dlon}'
              print(f'\n=== {place} {lat},{lon} ===')
              for t in times:
                  params = {
                      'service':'WMS',
                      'request':'GetMap',
                      'version':'1.3.0',
                      'layers':'msg_fes:fire',
                      'styles':'',
                      'format':'image/png',
                      'transparent':'true',
                      'crs':'EPSG:4326',
                      'bbox':bbox,
                      'width':'600',
                      'height':'600',
                      'time':t,
                  }
                  url = 'https://view.eumetsat.int/geoserver/wms?' + urllib.parse.urlencode(params)
                  try:
                      data = urllib.request.urlopen(url, timeout=60).read()
                      im = Image.open(io.BytesIO(data)).convert('RGBA')
                      arr = np.array(im)
                      # Find pixels with alpha > 0. Fire layer is transparent elsewhere.
                      alpha = arr[:,:,3]
                      nz = np.argwhere(alpha > 0)
                      print(t, 'HTTP_OK', 'size=', im.size, 'nontransparent=', len(nz))
                      if len(nz):
                          vals, counts = np.unique(arr[alpha>0][:,:3], axis=0, return_counts=True)
                          order = np.argsort(counts)[::-1][:10]
                          print('  top RGB:', [(vals[i].tolist(), int(counts[i])) for i in order])
                  except Exception as e:
                      print(t, 'ERROR', repr(e))
          PY

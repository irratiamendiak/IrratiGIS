name: Install Meteosat fix
on:
  push:
    paths:
      - 'meteosat-fix.js'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install script and cache bust
        shell: bash
        run: |
          sed -i 's#auth.js?v=20260907-[0-9]*#auth.js?v=20260907-50#' index.html
          grep -q 'meteosat-fix.js?v=20260907-50' index.html || sed -i 's#<script src="auth.js?v=20260907-50" defer></script>#<script src="auth.js?v=20260907-50" defer></script>\n<script src="meteosat-fix.js?v=20260907-50" defer></script>#' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load isolated Meteosat WMS fix'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/install-meteosat-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Meteosat workflow'
          git push

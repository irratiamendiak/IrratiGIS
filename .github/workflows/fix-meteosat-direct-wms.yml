name: Fix Meteosat direct WMS
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Meteosat
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('meteosat.js')
          s=p.read_text()
          s=s.replace('let map=null,enabled=false,loading=false,timer=null,h5=null,h5Promise=null;const files=new Map();let latestWms=null;', 'let map=null,enabled=false,loading=false,timer=null,h5=null,h5Promise=null;const files=new Map();let latestWms=null,directWms=null;')
          old='function fixFirmsPanel(){const mapc=map?.getContainer?.();if(!mapc)return;const target=mapc.querySelector(".leaflet-bottom.leaflet-left");const met=$("irratiMeteosatPanel");if(!target||!met)return;document.querySelectorAll(".leaflet-control").forEach(el=>{if(el!==met&&el.textContent.includes("NASA FIRMS · antigüedad")){if(el.parentElement!==target)target.appendChild(el);el.style.marginLeft="10px";el.style.marginBottom=`${Math.max(10,met.offsetHeight+12)}px`;el.style.float="none"}})}'
          new='function fixFirmsPanel(){const mapc=map?.getContainer?.();if(!mapc)return;const target=mapc.querySelector(".leaflet-bottom.leaflet-left"),met=$("irratiMeteosatPanel");if(!target||!met)return;document.querySelectorAll(".leaflet-control").forEach(el=>{if(el!==met&&el.textContent.includes("NASA FIRMS · antigüedad")){if(el.parentElement!==target)target.appendChild(el);el.style.marginLeft="10px";el.style.marginBottom="8px";el.style.float="none";met.style.bottom=`${el.offsetHeight+18}px`;}})}'
          if old not in s: raise SystemExit('fixFirmsPanel pattern not found')
          s=s.replace(old,new)
          marker='function styles(){'
          direct='function directWmsLayer(d){try{if(directWms){map.removeLayer(directWms)}}catch{};directWms=L.tileLayer.wms("https://adaguc.lsasvcs.ipma.pt//adagucserver?dataset=MSG-FRP&",{layers:"MSG:FRP-PIXEL",styles:"",format:"image/png",transparent:true,version:"1.1.1",time:slot(d),opacity:.95,zIndex:650});directWms.addTo(map)}\n'
          if direct not in s: s=s.replace(marker,direct+marker)
          oldtoggle='pane();await load();window.IrratiGISMeteosatLayer={toggle};schedule()'
          newtoggle='pane();directWmsLayer(r15(new Date(Date.now()-LATENCY)));await load();fixFirmsPanel();window.IrratiGISMeteosatLayer={toggle};schedule()'
          if oldtoggle not in s: raise SystemExit('toggle pattern not found')
          s=s.replace(oldtoggle,newtoggle)
          oldoff='timer=null;window.IrratiGISMeteosatLayer=null;status("Meteosat apagado");return}pane();'
          newoff='timer=null;if(directWms){try{map.removeLayer(directWms)}catch{}directWms=null}window.IrratiGISMeteosatLayer=null;status("Meteosat apagado");return}pane();'
          if oldoff not in s: raise SystemExit('off pattern not found')
          s=s.replace(oldoff,newoff)
          p.write_text(s)
          idx=Path('index.html')
          t=idx.read_text()
          t=re.sub(r'meteosat\.js\?v=[0-9-]+', 'meteosat.js?v=20260907-09', t)
          idx.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meteosat.js index.html
          git commit -m 'Use direct LSA SAF WMS for Meteosat detections'
          git push
      - name: Remove helper
        run: |
          git rm .github/workflows/fix-meteosat-direct-wms.yml
          git commit -m 'Remove Meteosat WMS helper'
          git push

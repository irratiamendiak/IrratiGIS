name: Deploy independent wildfire preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wildfire-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/wildfire-mdt-provider'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. No production resources were changed."
            exit 1
          fi

      - name: Create isolated Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages project create irratigis-wildfire-preview --production-branch main || true

      - name: Deploy PR frontend to isolated Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy . \
            --project-name irratigis-wildfire-preview \
            --branch feature-wildfire-mdt-provider \
            --commit-message "PR #10 wildfire terrain preview"

      - name: Verify preview HTML is reachable
        run: |
          set -euo pipefail
          URL="https://feature-wildfire-mdt-provider.irratigis-wildfire-preview.pages.dev"
          for attempt in $(seq 1 12); do
            CODE=$(curl -sS -L -o /tmp/preview.html -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ] && grep -qi '<html' /tmp/preview.html; then
              echo "Preview is reachable: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Preview did not return an HTML 200 response: $URL"
          exit 1

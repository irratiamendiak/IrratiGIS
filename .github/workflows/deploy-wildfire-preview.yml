name: Deploy independent wildfire preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wildfire-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["feature/wildfire-mdt-provider","feature/wildfire-propagation-summary-only"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. No production resources were changed."
            exit 1
          fi

      - name: Create isolated Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages project create irratigis-wildfire-preview --production-branch main || true

      - name: Create isolated preview API project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages project create irratigis-api-preview --production-branch preview || true

      - name: Deploy isolated preview API bridge
        working-directory: cf-api-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy . --project-name irratigis-api-preview --branch preview --commit-message "PR #13 isolated API bridge"

      - name: Verify preview API CORS and health
        run: |
          set -euo pipefail
          API_URL="https://preview.irratigis-api-preview.pages.dev"
          ORIGIN="https://feature-wildfire-propagation.irratigis-wildfire-preview.pages.dev"
          curl -fsS -D /tmp/api.headers -o /tmp/api-health.json -H "Origin: $ORIGIN" "$API_URL/api/health"
          grep -Fqi "access-control-allow-origin: $ORIGIN" /tmp/api.headers
          grep -Fq '"ok":true' /tmp/api-health.json
          echo "Preview API health and CORS verified."

      - name: Deploy PR frontend to isolated Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          SAFE_BRANCH=$(printf '%s' "$PREVIEW_BRANCH" | tr '/' '-')
          npx --yes wrangler@latest pages deploy . \
            --project-name irratigis-wildfire-preview \
            --branch "$SAFE_BRANCH" \
            --commit-message "PR #13 wildfire propagation summary preview" | tee /tmp/pages-deploy.log
          DEPLOY_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' /tmp/pages-deploy.log | tail -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Wrangler did not report a Pages deployment URL."
            exit 1
          fi
          echo "WILDFIRE_PREVIEW_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployment URL reported by Wrangler: $DEPLOY_URL"

      - name: Verify wildfire preview assets are wired into the preview
        run: |
          set -euo pipefail
          test -f index.html
          test -f auth.js
          test -f gis-tools.js
          grep -Fq 'wildfire' index.html
          echo "Frontend entry point and required application scripts are present."

      - name: Verify preview HTML is reachable
        run: |
          set -euo pipefail
          URL="$WILDFIRE_PREVIEW_URL"
          for attempt in $(seq 1 18); do
            CODE=$(curl -sS -L --max-time 20 -o /tmp/preview.html -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ] && grep -Eqi '<html([[:space:]>])' /tmp/preview.html; then
              echo "Preview is reachable: $URL"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $CODE from $URL"
            sleep 10
          done
          echo "::error::Deployment exists, but its reported URL did not return HTML 200: $URL"
          head -c 1000 /tmp/preview.html || true
          exit 1
